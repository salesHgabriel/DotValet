name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8: o app e os testes; 9/10: os apps de exemplo em samples/.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restaurar
        run: dotnet restore DotValet.sln

      - name: Compilar
        run: dotnet build DotValet.sln -c Release --no-restore

      - name: Testar
        run: dotnet test DotValet.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Compilar exemplos e ferramenta de screenshots
        shell: bash
        run: |
          for p in samples/*/*.csproj tools/*/*.csproj; do
            dotnet build "$p" -c Release
          done

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
